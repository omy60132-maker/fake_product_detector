<!DOCTYPE html>

<html>

<head>

<title>Admin Login</title>

<link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="login-box">

<h1>Admin Login</h1>

{% if error %}

<div class="error">
    {{ error }}
</div>

{% endif %}

<form method="POST">

<input
type="email"
name="email"
placeholder="Admin Email"
required
>

<input
type="password"
name="password"
placeholder="Password"
required
>

<button type="submit">
Login
</button>

</form>

<a href="{{ url_for('home') }}">
← Home
</a>

</div>

</body>

</html>
