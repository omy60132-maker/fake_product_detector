<!DOCTYPE html>

<html>

<head>

<title>Customer Register</title>

<link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="login-box">

<h1>Create Account</h1>

{% if error %}

<div class="error">
{{ error }}
</div>

{% endif %}

<form method="POST">

<input
type="text"
name="name"
placeholder="Full Name"
required
>

<input
type="email"
name="email"
placeholder="Email"
required
>

<input
type="password"
name="password"
placeholder="Password"
required
>

<button type="submit">
Register
</button>

</form>

<a href="{{ url_for('customer_login') }}">
Already have an account? Login
</a>

</div>

</body>

</html>
