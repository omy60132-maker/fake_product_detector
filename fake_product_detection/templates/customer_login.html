<!DOCTYPE html>

<html>

<head>

<title>Customer Login</title>

<link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="login-box">

<h1>Customer Login</h1>

{% if error %}

<div class="error">
{{ error }}
</div>

{% endif %}

<form method="POST">

<input
type="email"
name="email"
placeholder="Email"
required
>

<input
type="password"
name="password"
placeholder="Password"
required
>

<button type="submit">
Login
</button>

</form>

<p>
Don't have an account?
</p>

<a href="{{ url_for('customer_register') }}">
Create Account
</a>

<br><br>

<a href="{{ url_for('home') }}">
← Home
</a>

</div>

</body>

</html>
